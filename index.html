<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Past Performance & Market Edge Analyzer</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-color: #38bdf8;
      --green-bg: #166534;
      --green-text: #4ade80;
      --red-bg: #991b1b;
      --red-text: #f87171;
      --gold-bg: #854d0e;
      --gold-text: #fde047;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1, h2, h3 {
      color: var(--text-main);
      margin-top: 0;
    }

    .control-panel {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 15px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
    }

    input[type="file"], select, button {
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    button {
      background: #0284c7;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }

    button:hover {
      background: var(--accent-color);
      color: #0f172a;
    }

    .status {
      font-size: 0.8rem;
      margin-top: 4px;
    }

    .status.ok { color: var(--green-text); }
    .status.err { color: var(--red-text); }

    .field-race {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .field-race-head {
      background: #0f172a;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    .field-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.85rem;
    }

    .field-table th, .field-table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .field-table th {
      background: #182234;
      color: var(--text-muted);
      font-weight: 600;
    }

    .field-table tr:hover {
      background: #273549;
    }

    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      margin-right: 4px;
    }

    .badge-prime { background: var(--gold-bg); color: var(--gold-text); }
    .badge-speed { background: #1e40af; color: #93c5fd; }
    .badge-pace { background: #6b21a8; color: #e9d5ff; }

    .field-edge.pos { color: var(--green-text); font-weight: bold; }
    .field-edge.neg { color: var(--red-text); }
    .field-edge.dash { color: var(--text-muted); }
  </style>
</head>
<body>

<div class="container">
  <h1>Horse Racing Past Performance & Value Analyzer</h1>
  
  <div class="control-panel">
    <div class="input-group">
      <label for="drfInput">Upload Brisnet DRF / CSV File</label>
      <input type="file" id="drfInput" accept=".drf,.csv,.txt">
      <div id="drfStatus" class="status"></div>
    </div>

    <div class="input-group">
      <label for="rssInput">Upload Equibase RSS / XML File</label>
      <input type="file" id="rssInput" accept=".rss,.xml">
      <div id="rssStatus" class="status"></div>
    </div>

    <div class="input-group">
      <label for="sortOption">Sort Race Field By</label>
      <select id="sortOption">
        <option value="post">Post Position</option>
        <option value="edge">Highest Value Edge</option>
        <option value="criteria">High-Probability Criteria Score</option>
      </select>
    </div>

    <div class="input-group" style="justify-content: flex-end;">
      <button id="computeBtn">Compute Value & Analyze Field</button>
    </div>
  </div>

  <div id="resultsSection" style="display: none;">
    <h2>Race Field Breakdown & Criteria Flags</h2>
    <div id="fieldTables"></div>
  </div>
</div>

<script>
  let rows = [];
  let computedRaces = [];
  let currentSort = 'post';

  const DRF_CLASS_RANK = {
    'G1': 10, 'G2': 9, 'G3': 8, 'N': 7, 'A': 6, 'C': 5, 'S': 4, 'M': 2
  };

  function escAttr(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function titleCase(str) {
    return str ? str.toLowerCase().replace(/(?:^|\s)\w/g, match => match.toUpperCase()) : '';
  }

  /* ---------------- Core File Parsers ---------------- */

  function parseBrisnetSingleFile(text) {
    const lines = text.split(/\r?\n/);
    const out = [];

    lines.forEach(line => {
      if (!line.trim()) return;
      const fields = line.split(/,(?=(?:[^\"]*\"[^\"]*\")*[^\"]*$)/).map(f => f.replace(/^"|"$/g, '').trim());
      if (fields.length < 50) return;

      const get = (idx) => fields[idx - 1] || '';
      const num = (idx) => {
        const val = parseFloat(get(idx));
        return isNaN(val) ? 0 : val;
      };

      const race = get(3);
      const post = get(4);
      const horse = get(6);
      const odds = get(14) || get(15) || '5/1';
      const primePower = num(251); 
      const runStyle = get(252);
      const todayClassTxt = get(12);
      const rtype = get(11);

      // Extract Recent Past Performance Speed Figures
      const ppSpeedFigs = [];
      const ppRaces = [];
      for (let i = 0; i < 10; i++) {
        const pDate = get(256 + i);
        if (!pDate) continue;
        const pSpeed = num(716 + i);
        if (pSpeed > 0) ppSpeedFigs.push(pSpeed);

        ppRaces.push({
          date: pDate,
          track: get(266 + i),
          distYds: num(316 + i),
          surface: get(286 + i),
          classCode: get(336 + i),
          speedFig: pSpeed,
          finishPos: get(616 + i),
          beatenL: num(736 + i),
          comment: get(396 + i)
        });
      }

      // High-Probability Criteria Calculation: Best 2 of Last 3 Speed Figs
      const last3 = ppSpeedFigs.slice(0, 3);
      let best2Of3Avg = 0;
      if (last3.length >= 2) {
        last3.sort((a, b) => b - a);
        best2Of3Avg = (last3[0] + last3[1]) / 2;
      } else if (last3.length === 1) {
        best2Of3Avg = last3[0];
      }

      out.push({
        race: race,
        post: post,
        horse: titleCase(horse),
        odds: odds,
        finalOdds: '',
        score: primePower || num(211) || 100,
        primePower: primePower,
        runStyle: runStyle,
        best2Of3Avg: best2Of3Avg,
        raceClassTxt: todayClassTxt,
        raceType: rtype,
        scratched: false,
        ppRaces: ppRaces
      });
    });

    return out;
  }

  function parseEquibaseRss(xmlText) {
    const parser = new DOMParser();
    const xmlDoc = parser.parseFromString(xmlText, "text/xml");
    const items = xmlDoc.querySelectorAll("item");
    const out = [];

    items.forEach(item => {
      const title = item.querySelector("title") ? item.querySelector("title").textContent : "";
      const description = item.querySelector("description") ? item.querySelector("description").textContent : "";
      
      const raceMatch = title.match(/Race\s+(\d+)/i);
      const race = raceMatch ? raceMatch[1] : "1";

      const lines = description.split(/\n|<br\s*\/?>/i);
      lines.forEach((line, idx) => {
        if (!line.trim()) return;
        const parts = line.split(',');
        if (parts.length >= 3) {
          out.push({
            race: race,
            post: (idx + 1).toString(),
            horse: parts[0].replace(/<\/?[^>]+(>|$)/g, "").trim(),
            odds: parts[1] ? parts[1].trim() : '5/1',
            finalOdds: '',
            score: 100,
            primePower: 0,
            runStyle: 'E',
            best2Of3Avg: 0,
            scratched: false,
            ppRaces: []
          });
        }
      });
    });

    return out;
  }

  /* ---------------- File Event Listeners ---------------- */

  document.getElementById('drfInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(evt) {
      try {
        const parsedRows = parseBrisnetSingleFile(evt.target.result);
        if (parsedRows.length > 0) {
          rows = parsedRows;
          document.getElementById('drfStatus').className = 'status ok';
          document.getElementById('drfStatus').textContent = `Loaded ${parsedRows.length} entries from Brisnet DRF.`;
        } else throw new Error("No valid race rows found.");
      } catch (err) {
        document.getElementById('drfStatus').className = 'status err';
        document.getElementById('drfStatus').textContent = `Parse error: ${err.message}`;
      }
    };
    reader.readAsText(file);
  });

  document.getElementById('rssInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(evt) {
      try {
        const parsedRows = parseEquibaseRss(evt.target.result);
        if (parsedRows.length > 0) {
          rows = parsedRows;
          document.getElementById('rssStatus').className = 'status ok';
          document.getElementById('rssStatus').textContent = `Loaded ${parsedRows.length} entries from Equibase RSS.`;
        } else throw new Error("No valid entries in XML/RSS.");
      } catch (err) {
        document.getElementById('rssStatus').className = 'status err';
        document.getElementById('rssStatus').textContent = `Parse error: ${err.message}`;
      }
    };
    reader.readAsText(file);
  });

  /* ---------------- Odds & Criteria Processing ---------------- */

  function oddsToProbability(oddsStr) {
    if (!oddsStr) return 0;
    const clean = oddsStr.trim();
    if (clean.includes('/')) {
      const parts = clean.split('/');
      const num = parseFloat(parts[0]), den = parseFloat(parts[1]);
      if (!isNaN(num) && !isNaN(den) && (num + den) > 0) return den / (num + den);
    }
    const dec = parseFloat(clean);
    return (!isNaN(dec) && dec > 0) ? (dec > 1 ? 1 / dec : dec) : 0;
  }

  function computeCard() {
    const activeRows = rows.filter(r => !r.scratched && r.race && r.horse);
    if (!activeRows.length) return;

    const racesMap = {};
    activeRows.forEach(r => {
      if (!racesMap[r.race]) racesMap[r.race] = [];
      racesMap[r.race].push(r);
    });

    computedRaces = [];

    Object.keys(racesMap).sort((a,b) => parseInt(a,10) - parseInt(b,10)).forEach(raceNum => {
      const entries = racesMap[raceNum];

      // Field Stats for Criteria Processing
      const primePowers = entries.map(e => e.primePower).sort((a,b) => b - a);
      const speedAvgs = entries.map(e => e.best2Of3Avg).sort((a,b) => b - a);
      const earlyRunners = entries.filter(e => e.runStyle && e.runStyle.startsWith('E'));

      let totalRawProb = 0;
      let totalScore = 0;

      entries.forEach(r => {
        r._rawProb = oddsToProbability(r.finalOdds || r.odds);
        totalRawProb += r._rawProb;
        r._scoreVal = parseFloat(r.score) || 0;
        totalScore += r._scoreVal;
      });

      const processedEntries = entries.map(r => {
        const fairMktProb = totalRawProb > 0 ? (r._rawProb / totalRawProb) : 0;
        const modelProb = totalScore > 0 ? (r._scoreVal / totalScore) : 0;
        const edge = modelProb - fairMktProb;

        // Apply High-Probability Criteria Rules
        const flags = [];
        let criteriaScore = 0;

        // 1. Prime Power 3.0+ Point Gap
        if (r.primePower > 0 && primePowers.length > 1 && r.primePower === primePowers[0]) {
          const gap = r.primePower - primePowers[1];
          if (gap >= 3.0) {
            flags.push(`Prime Gap (+${gap.toFixed(1)})`);
            criteriaScore += 3;
          }
        }

        // 2. Best 2 of 3 Speed Figure Leader
        if (r.best2Of3Avg > 0 && r.best2Of3Avg === speedAvgs[0]) {
          flags.push(`Speed #1 (${r.best2Of3Avg.toFixed(0)})`);
          criteriaScore += 2;
        }

        // 3. Lone Speed Setup
        if (r.runStyle && r.runStyle.startsWith('E') && earlyRunners.length === 1) {
          flags.push('Lone Speed');
          criteriaScore += 2;
        }

        return {
          ...r,
          fairMktProb: fairMktProb,
          modelProb: modelProb,
          edge: edge,
          flags: flags,
          criteriaScore: criteriaScore
        };
      });

      computedRaces.push({
        raceNum: raceNum,
        entries: processedEntries
      });
    });

    renderCardOutput();
  }

  document.getElementById('computeBtn').addEventListener('click', computeCard);
  document.getElementById('sortOption').addEventListener('change', (e) => {
    currentSort = e.target.value;
    if (computedRaces.length) renderCardOutput();
  });

  function renderCardOutput() {
    document.getElementById('resultsSection').style.display = 'block';
    const container = document.getElementById('fieldTables');
    container.innerHTML = '';

    computedRaces.forEach(r => {
      const raceBox = document.createElement('div');
      raceBox.className = 'field-race';

      let entries = [...r.entries];
      if (currentSort === 'edge') {
        entries.sort((a,b) => b.edge - a.edge);
      } else if (currentSort === 'criteria') {
        entries.sort((a,b) => b.criteriaScore - a.criteriaScore);
      } else {
        entries.sort((a,b) => parseInt(a.post,10) - parseInt(b.post,10));
      }

      const rowsHtml = entries.map(e => {
        const edgePct = (e.edge * 100).toFixed(1);
        const edgeClass = e.edge > 0.02 ? 'pos' : (e.edge < -0.02 ? 'neg' : 'dash');
        const formattedEdge = e.edge > 0 ? `+${edgePct}%` : `${edgePct}%`;
        const badges = e.flags.map(f => `<span class="badge ${f.includes('Prime') ? 'badge-prime' : f.includes('Speed') ? 'badge-speed' : 'badge-pace'}">${f}</span>`).join('');

        return `
          <tr>
            <td>${e.post}</td>
            <td><b>${escAttr(e.horse)}</b></td>
            <td>${escAttr(e.odds)}</td>
            <td>${(e.fairMktProb * 100).toFixed(1)}%</td>
            <td>${(e.modelProb * 100).toFixed(1)}%</td>
            <td><span class="field-edge ${edgeClass}">${formattedEdge}</span></td>
            <td>${badges || '<span style="color:var(--text-muted)">-</span>'}</td>
          </tr>
        `;
      }).join('');

      raceBox.innerHTML = `
        <div class="field-race-head">
          <strong>Race ${r.raceNum}</strong>
        </div>
        <table class="field-table">
          <thead>
            <tr>
              <th style="width:50px">Post</th>
              <th>Horse</th>
              <th style="width:70px">ML</th>
              <th style="width:80px">Mkt %</th>
              <th style="width:80px">Model %</th>
              <th style="width:80px">Edge</th>
              <th>High-Probability Signals</th>
            </tr>
          </thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      `;
      container.appendChild(raceBox);
    });
  }
</script>
</body>
</html>
