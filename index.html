<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Equibase Scratch Monitor</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 20px;
            background-color: #f4f6f8;
            color: #333;
        }
        .container {
            max-width: 950px;
            margin: 0 auto;
            background: #ffffff;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        input, select, button {
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #0066cc;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #0052a3;
        }
        .status-bar {
            margin-bottom: 15px;
            font-size: 13px;
            color: #666;
            display: flex;
            justify-content: space-between;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            text-align: left;
            padding: 10px 12px;
            border-bottom: 1px solid #e1e4e8;
        }
        th {
            background-color: #f8f9fa;
            font-weight: 600;
        }
        tr:hover {
            background-color: #f1f5f9;
        }
        .badge-scratch {
            background-color: #ffebe9;
            color: #cf222e;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
        .no-data {
            text-align: center;
            padding: 20px;
            color: #888;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Live Equibase Scratch Monitor</h2>

    <div class="controls">
        <label for="trackCode"><strong>Track Code:</strong></label>
        <input type="text" id="trackCode" value="SAR-USA" placeholder="e.g. SAR-USA, GP-USA, MNR-USA">

        <label for="pollInterval"><strong>Refresh (Sec):</strong></label>
        <input type="number" id="pollInterval" value="30" min="5" style="width: 70px;">

        <button id="startBtn" onclick="toggleMonitoring()">Start Monitoring</button>
    </div>

    <div class="status-bar">
        <span id="statusText">Status: Idle</span>
        <span id="lastUpdated">Last Checked: Never</span>
    </div>

    <table>
        <thead>
            <tr>
                <th>Time Detected</th>
                <th>Race #</th>
                <th>Program # & Horse</th>
                <th>Details / Reason</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="scratchTableBody">
            <tr>
                <td colspan="5" class="no-data">No scratches loaded yet. Click "Start Monitoring".</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    let isMonitoring = false;
    let timerId = null;
    const seenScratches = new Set();

    async function fetchAndParseScratches() {
        const trackCode = document.getElementById("trackCode").value.trim().toUpperCase();
        const statusText = document.getElementById("statusText");
        const lastUpdated = document.getElementById("lastUpdated");
        
        if (!trackCode) {
            alert("Please enter a valid track code.");
            return;
        }

        statusText.innerText = `Status: Fetching updates for ${trackCode}...`;
        
        const cacheBuster = Date.now();
        const targetUrl = `https://www.equibase.com/static/latechanges/html/latechanges${trackCode}.html?cb=${cacheBuster}`;
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;

        try {
            const response = await fetch(proxyUrl);
            if (!response.ok) throw new Error("Network response failed");
            
            const data = await response.json();
            const rawHtmlOrXml = data.contents;

            if (rawHtmlOrXml) {
                parseFeedPayload(rawHtmlOrXml);
                statusText.innerText = `Status: Active (Monitoring ${trackCode})`;
            } else {
                statusText.innerText = `Status: Received empty payload from track feed.`;
            }

            const now = new Date();
            lastUpdated.innerText = `Last Checked: ${now.toLocaleTimeString()}`;

        } catch (error) {
            console.error("Fetch error:", error);
            statusText.innerText = `Status: Error fetching feed (${error.message})`;
        }
    }

    function parseFeedPayload(payload) {
        const parser = new DOMParser();
        
        // Handle RSS/XML payload vs raw HTML page payload seamlessly
        let descriptions = [];
        if (payload.includes("<rss") || payload.includes("<xml")) {
            const xmlDoc = parser.parseFromString(payload, 'text/xml');
            const items = xmlDoc.querySelectorAll("item description");
            items.forEach(item => descriptions.push(item.textContent));
        } else {
            descriptions.push(payload);
        }

        descriptions.forEach(desc => {
            // Split entries separated by HTML line breaks <br/> or newlines
            const entries = desc.split(/<br\s*\/?>|\n/gi);

            entries.forEach(line => {
                // Strip inline HTML tags (<b>, <i>, etc.) to evaluate clean text
                const cleanLine = line.replace(/<[^>]*>/g, '').trim();
                if (!cleanLine) return;

                // Check for Scratch indicators
                if (cleanLine.includes("Scratched") || cleanLine.includes("Scratch Reason")) {
                    
                    // Extract Race Number (e.g., "Race 01:" or "Race 5:")
                    const raceMatch = cleanLine.match(/Race\s*(\d+):/i);
                    const raceNum = raceMatch ? parseInt(raceMatch[1], 10) : "N/A";

                    // Extract Program # and Horse Name (e.g., "# 7 Classy Runner" or "#11 Funny Words")
                    const horseMatch = cleanLine.match(/#\s*(\d+[A-Z]?\s+[^S-]+)/i);
                    const horseInfo = horseMatch ? `#${horseMatch[1].trim()}` : "N/A";

                    // Extract Reason / Details after the hyphen or keyword
                    let reason = "Scratched";
                    if (cleanLine.includes("-")) {
                        reason = cleanLine.split("-").pop().trim();
                    } else if (cleanLine.includes("changed to")) {
                        reason = cleanLine.split("changed to").pop().trim();
                    }

                    // Deduplication ID
                    const scratchId = `R${raceNum}_${horseInfo}_${reason}`;

                    if (!seenScratches.has(scratchId)) {
                        seenScratches.add(scratchId);
                        appendScratchToTable(raceNum, horseInfo, reason, cleanLine);
                    }
                }
            });
        });
    }

    function appendScratchToTable(race, horse, reason, rawLine) {
        const tbody = document.getElementById("scratchTableBody");
        
        if (tbody.querySelector(".no-data")) {
            tbody.innerHTML = "";
        }

        const now = new Date().toLocaleTimeString();
        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${now}</td>
            <td><strong>Race ${race}</strong></td>
            <td><strong>${horse}</strong></td>
            <td>${reason} <br><small style="color:#777;">${rawLine}</small></td>
            <td><span class="badge-scratch">SCRATCHED</span></td>
        `;

        tbody.insertBefore(row, tbody.firstChild);
    }

    function toggleMonitoring() {
        const btn = document.getElementById("startBtn");
        const statusText = document.getElementById("statusText");

        if (isMonitoring) {
            clearInterval(timerId);
            isMonitoring = false;
            btn.innerText = "Start Monitoring";
            btn.style.backgroundColor = "#0066cc";
            statusText.innerText = "Status: Stopped";
        } else {
            isMonitoring = true;
            btn.innerText = "Stop Monitoring";
            btn.style.backgroundColor = "#d9381e";
            
            fetchAndParseScratches();
            
            const intervalSec = parseInt(document.getElementById("pollInterval").value, 10) || 30;
            timerId = setInterval(fetchAndParseScratches, intervalSec * 1000);
        }
    }
</script>

</body>
</html>
