<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlay Board — Race Value Finder</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --overlay-green: #10b981;
      --overlay-red: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; font-size: 14px; }
    .container { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

    h1 { font-size: 1.5rem; color: #fff; margin-bottom: 4px; }
    p.subtitle { color: var(--text-muted); font-size: 0.85rem; }

    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
    .card-title { font-weight: 600; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }

    .import-tools { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media(max-width: 768px) { .import-tools { grid-template-columns: 1fr; } }

    textarea { width: 100%; height: 100px; background: #0f172a; border: 1px solid var(--border); color: #fff; border-radius: 4px; padding: 8px; font-family: monospace; font-size: 0.8rem; resize: vertical; }
    
    .mapping-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-top: 10px; }
    .mapping-grid label { font-size: 0.75rem; color: var(--text-muted); display: block; margin-bottom: 2px; }
    .mapping-grid select { width: 100%; background: #0f172a; border: 1px solid var(--border); color: #fff; padding: 4px; border-radius: 4px; font-size: 0.8rem; }

    button { background: var(--accent); color: white; border: none; padding: 6px 12px; border-radius: 4px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background: var(--accent-hover); }
    button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
    button.secondary:hover { background: var(--border); }
    button.danger { background: #dc2626; }
    button.danger:hover { background: #b91c1c; }

    .status { margin-top: 8px; font-size: 0.8rem; }
    .status.err { color: #f87171; }
    .status.ok { color: #34d399; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
    th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--text-muted); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; background: #131d31; }
    
    input[type="text"], input[type="number"] { background: #0f172a; border: 1px solid var(--border); color: #fff; padding: 4px 6px; border-radius: 4px; width: 100%; font-size: 0.85rem; }
    
    .overlay-tag { font-weight: 700; padding: 2px 6px; border-radius: 4px; display: inline-block; }
    .overlay-positive { background: rgba(16, 185, 129, 0.2); color: var(--overlay-green); }
    .overlay-negative { background: rgba(239, 68, 68, 0.2); color: var(--overlay-red); }

    .controls-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  </style>
</head>
<body>

<div class="container">
  <div>
    <h1>Overlay Board — Race Value Finder</h1>
    <p class="subtitle">Identify betting overlays by comparing Fair Odds / Morning Line against Live Odds.</p>
  </div>

  <div class="card">
    <div class="card-title">Import Data</div>
    <div class="import-tools">
      <div>
        <label style="font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 4px;">CSV File Upload</label>
        <input type="file" id="csvFileInput" accept=".csv, .txt" style="font-size: 0.8rem; margin-bottom: 8px; color: var(--text-muted);">
        <div id="mappingArea" style="display:none;">
          <div class="mapping-grid">
            <div><label>Race #</label><select id="mapRace"></select></div>
            <div><label>Post</label><select id="mapPost"></select></div>
            <div><label>Horse Name</label><select id="mapHorse"></select></div>
            <div><label>Fair / ML Odds</label><select id="mapOdds"></select></div>
            <div><label>Live / Final Odds</label><select id="mapFinalOdds"></select></div>
          </div>
          <button id="importCsvBtn" style="margin-top: 10px;">Import Mapped CSV</button>
        </div>
      </div>
      <div>
        <label style="font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 4px;">Paste Raw Text / Entries</label>
        <textarea id="rawPasteInput" placeholder="Paste entries or raw text (e.g. 1 Secretariat 3/5 or 2 Citation 5-2 3.1)..."></textarea>
        <button id="parseTextBtn" style="margin-top: 6px;">Parse & Append Text</button>
      </div>
    </div>
    <div id="csvStatus" class="status"></div>
  </div>

  <div class="card">
    <div class="card-title">
      <span>Race Entries &amp; Overlay Metrics</span>
      <div>
        <button id="addRowBtn" class="secondary">+ Add Runner</button>
        <button id="clearAllBtn" class="danger">Clear Board</button>
      </div>
    </div>

    <table id="runnerTable">
      <thead>
        <tr>
          <th style="width: 60px;">Race</th>
          <th style="width: 50px;">PP</th>
          <th>Horse</th>
          <th style="width: 100px;">ML / Fair</th>
          <th style="width: 100px;">Live Odds</th>
          <th style="width: 100px;">Fair Prob %</th>
          <th style="width: 100px;">Live Prob %</th>
          <th style="width: 100px;">Overlay Edge</th>
          <th style="width: 40px;"></th>
        </tr>
      </thead>
      <tbody id="runnerBody"></tbody>
    </table>
  </div>
</div>

<script>
  let rows = [];
  let lastCsvData = null;
  let headers = [];

  const mapSelects = {
    race: document.getElementById('mapRace'),
    post: document.getElementById('mapPost'),
    horse: document.getElementById('mapHorse'),
    odds: document.getElementById('mapOdds'),
    finalOdds: document.getElementById('mapFinalOdds')
  };

  const csvFileInput = document.getElementById('csvFileInput');
  const mappingArea = document.getElementById('mappingArea');
  const csvStatus = document.getElementById('csvStatus');
  const runnerBody = document.getElementById('runnerBody');

  // --- Utility Functions ---
  function parseOddsToDecimal(val) {
    if (!val) return null;
    let s = val.toString().trim().replace('$', '').replace(':1', '');
    if (s.includes('/')) {
      const parts = s.split('/');
      const num = parseFloat(parts[0]), den = parseFloat(parts[1]);
      if (!isNaN(num) && !isNaN(den) && den !== 0) return num / den;
    }
    if (s.includes('-')) {
      const parts = s.split('-');
      const num = parseFloat(parts[0]), den = parseFloat(parts[1]);
      if (!isNaN(num) && !isNaN(den) && den !== 0) return num / den;
    }
    const parsed = parseFloat(s);
    return isNaN(parsed) ? null : parsed;
  }

  function parseCSVLine(line) {
    const result = [];
    let cur = '', inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { inQuotes = !inQuotes; }
      else if (c === ',' && !inQuotes) { result.push(cur.trim()); cur = ''; }
      else { cur += c; }
    }
    result.push(cur.trim());
    return result;
  }

  function parseCSV(text) {
    const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
    if (lines.length < 2) return null;
    const rawHeaders = parseCSVLine(lines[0]);
    const data = [];
    for (let i = 1; i < lines.length; i++) {
      const vals = parseCSVLine(lines[i]);
      const obj = {};
      rawHeaders.forEach((h, idx) => { obj[h] = vals[idx] || ''; });
      data.push(obj);
    }
    return { headers: rawHeaders, data };
  }

  function newRow(data = {}) {
    return {
      id: Date.now() + Math.random(),
      race: data.race || '1',
      post: data.post || '',
      horse: data.horse || '',
      odds: data.odds || '',
      finalOdds: data.finalOdds || ''
    };
  }

  // --- Core Overlay Calculation Engine ---
  function renderTable() {
    runnerBody.innerHTML = '';
    rows.forEach(r => {
      const tr = document.createElement('tr');

      const mlDec = parseOddsToDecimal(r.odds);
      const liveDec = parseOddsToDecimal(r.finalOdds);

      const fairProb = mlDec !== null ? (1 / (mlDec + 1)) * 100 : null;
      const liveProb = liveDec !== null ? (1 / (liveDec + 1)) * 100 : null;

      let edge = null;
      if (mlDec !== null && liveDec !== null && mlDec > 0) {
        edge = ((liveDec - mlDec) / mlDec) * 100;
      }

      tr.innerHTML = `
        <td><input type="text" value="${r.race}" data-id="${r.id}" data-field="race"></td>
        <td><input type="text" value="${r.post}" data-id="${r.id}" data-field="post"></td>
        <td><input type="text" value="${r.horse}" data-id="${r.id}" data-field="horse"></td>
        <td><input type="text" value="${r.odds}" placeholder="5-2, 2.5" data-id="${r.id}" data-field="odds"></td>
        <td><input type="text" value="${r.finalOdds}" placeholder="7-2, 3.5" data-id="${r.id}" data-field="finalOdds"></td>
        <td>${fairProb !== null ? fairProb.toFixed(1) + '%' : '-'}</td>
        <td>${liveProb !== null ? liveProb.toFixed(1) + '%' : '-'}</td>
        <td>
          ${edge !== null 
            ? `<span class="overlay-tag ${edge >= 0 ? 'overlay-positive' : 'overlay-negative'}">${edge >= 0 ? '+' : ''}${edge.toFixed(1)}%</span>` 
            : '-'}
        </td>
        <td><button class="danger" style="padding: 2px 6px; font-size: 0.75rem;" onclick="removeRow(${r.id})">&times;</button></td>
      `;
      runnerBody.appendChild(tr);
    });

    runnerBody.querySelectorAll('input').forEach(inp => {
      inp.addEventListener('input', (e) => {
        const id = parseFloat(e.target.getAttribute('data-id'));
        const field = e.target.getAttribute('data-field');
        const targetRow = rows.find(x => x.id === id);
        if (targetRow) {
          targetRow[field] = e.target.value;
          renderTable();
        }
      });
    });
  }

  window.removeRow = function(id) {
    rows = rows.filter(r => r.id !== id);
    renderTable();
  };

  // --- CSV Handling ---
  csvFileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (evt) => {
      const parsed = parseCSV(evt.target.result);
      if (!parsed || parsed.headers.length === 0) {
        csvStatus.textContent = 'Invalid or empty CSV file.';
        csvStatus.className = 'status err';
        return;
      }

      headers = parsed.headers;
      lastCsvData = parsed.data;

      Object.keys(mapSelects).forEach(key => {
        const sel = mapSelects[key];
        sel.innerHTML = '<option value="">-- None --</option>';
        headers.forEach(h => {
          const opt = document.createElement('option');
          opt.value = h;
          opt.textContent = h;
          sel.appendChild(opt);
        });
      });

      // Auto-select common column header matches
      headers.forEach(h => {
        const lower = h.toLowerCase();
        if (lower.includes('race')) mapSelects.race.value = h;
        if (lower.includes('post') || lower.includes('pp') || lower === 'num') mapSelects.post.value = h;
        if (lower.includes('horse') || lower.includes('name') || lower.includes('runner')) mapSelects.horse.value = h;
        if (lower.includes('ml') || lower.includes('morning') || lower.includes('fair')) mapSelects.odds.value = h;
        if (lower.includes('live') || lower.includes('final') || lower.includes('current')) mapSelects.finalOdds.value = h;
      });

      mappingArea.style.display = 'block';
      csvStatus.textContent = `Loaded ${lastCsvData.length} records. Please confirm column mapping.`;
      csvStatus.className = 'status ok';
    };
    reader.readAsText(file);
  });

  document.getElementById('importCsvBtn').addEventListener('click', () => {
    if (!lastCsvData) return;
    const m = Object.fromEntries(Object.entries(mapSelects).map(([k, s]) => [k, s.value]));
    if (!m.horse || !m.odds) {
      csvStatus.textContent = 'Horse and Fair/ML odds columns are required.';
      csvStatus.className = 'status err';
      return;
    }

    let added = 0;
    lastCsvData.forEach(r => {
      const horse = (r[m.horse] || '').trim();
      if (!horse) return;
      rows.push(newRow({
        race: m.race ? (r[m.race] || '').trim() : '1',
        post: m.post ? (r[m.post] || '').trim() : '',
        horse,
        odds: m.odds ? (r[m.odds] || '').trim() : '',
        finalOdds: m.finalOdds ? (r[m.finalOdds] || '').trim() : ''
      }));
      added++;
    });

    csvStatus.textContent = `Successfully imported ${added} entries.`;
    csvStatus.className = 'status ok';
    renderTable();
  });

  // --- Raw Text Parser ---
  document.getElementById('parseTextBtn').addEventListener('click', () => {
    const raw = document.getElementById('rawPasteInput').value;
    if (!raw.trim()) return;

    const lines = raw.split(/\r?\n/);
    let count = 0;

    lines.forEach(line => {
      const l = line.trim();
      if (!l) return;

      // Regex matches format: [Optional PP] [Horse Name] [Odds] [Optional Live Odds]
      const match = l.match(/^(?:(\d+)\s+)?([A-Za-z0-9'\s\.\-]+?)\s+(\d+(?:[\/\-]\d+|\.\d+)?)(?:\s+(\d+(?:[\/\-]\d+|\.\d+)?))?$/);
      if (match) {
        rows.push(newRow({
          race: '1',
          post: match[1] || '',
          horse: match[2].trim(),
          odds: match[3] || '',
          finalOdds: match[4] || ''
        }));
        count++;
      }
    });

    if (count > 0) {
      csvStatus.textContent = `Parsed ${count} entries from text.`;
      csvStatus.className = 'status ok';
      renderTable();
    } else {
      csvStatus.textContent = 'Could not parse text. Ensure format matches: [PP] [Name] [ML Odds] [Live Odds]';
      csvStatus.className = 'status err';
    }
  });

  // --- Control Buttons ---
  document.getElementById('addRowBtn').addEventListener('click', () => {
    rows.push(newRow());
    renderTable();
  });

  document.getElementById('clearAllBtn').addEventListener('click', () => {
    if (confirm('Clear all entries from the board?')) {
      rows = [];
      renderTable();
    }
  });

  // Initial Seed Row
  rows.push(newRow({ race: '1', post: '1', horse: 'Flightline', odds: '3/5', finalOdds: '4/5' }));
  renderTable();
</script>
</body>
</html>
