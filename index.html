<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f0f0f;color:#e8e8e8;min-height:100vh}

.rh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;flex-wrap:wrap;gap:8px}

tr:nth-child(even){background:#161616}
tr:hover{background:#1f1f1f}
.pos-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(55px,1fr));gap:5px;margin-top:6px}

.err-box{background:rgba(255,82,82,0.1);border:1px solid rgba(255,82,82,0.3);border-radius:10px;padding:16px;margin-top:20px;color:#ff5252;font-size:13px;text-align:left;max-width:600px}
.log-box{background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:12px;margin-top:16px;font-family:monospace;font-size:11px;color:#888;text-align:left;max-width:600px;max-height:200px;overflow-y:auto}

<body>

<div class="up" id="us">
  <div class="uz" onclick="document.getElementById('fi').click()">

  </div>
  <input type="file" id="fi" accept=".pdf,.csv,.json" onchange="handleFile(this.files[0])">
  <div style="margin-top:24px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
    <button onclick="loadDemoPP()" style="padding:12px 24px;border-radius:10px;border:1px solid #00c853;background:rgba(0,200,83,0.1);color:#00c853;font-size:14px;cursor:pointer;font-weight:700">📋 PP Demo</button>

  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">

      <h1 id="tn" style="font-size:18px">Track</h1>

<script>
// ==================== DEBUG ====================
const logs=[];
function log(msg){logs.push(msg);console.log(msg);const el=document.getElementById('lsLog');if(el){el.style.display='block';el.innerHTML+='<div>'+msg+'</div>';el.scrollTop=el.scrollHeight;}}
function logErr(msg){log('<b style=color:#ff5252>ERROR: '+msg+'</b>');}

// ==================== STATE ====================
let td={races:[],mode:'pp',cf:'all'},er=new Set();

// ==================== FILE HANDLER ====================
async function handleFile(f){
  if(!f)return;
  document.getElementById('us').style.display='none';
  document.getElementById('ls').style.display='block';
  const name=f.name.toLowerCase();
  log('File: '+f.name+' ('+(f.size/1024).toFixed(1)+' KB)');

  try{
    if(name.endsWith('.pdf')){
      log('Extracting with pdf.js...');
      const text=await extractPDFText(f);
      log('Extracted '+text.length+' chars');
      log('Sample: '+text.substring(0,180).replace(/\n/g,' | '));

      const fmt=detectFormat(text);
      log('Format: '+fmt);

      let races;
      if(fmt==='results'){races=parseResultsText(text);td={name:races[0]?.track||'BRISNET',date:races[0]?.date||'',mode:'rc',races:races};}
      else if(fmt==='entries'){races=parseEntriesText(text);td={name:races[0]?.track||'BRISNET',date:races[0]?.date||'',mode:'en',races:races};}
      else{throw new Error('Unknown format. Need BRISNET Results or Entries PDF.');}

      log('Parsed '+races.length+' races, '+races.reduce((a,r)=>a+r.horses.length,0)+' horses');
    }else if(name.endsWith('.json')){
      td=JSON.parse(await f.text());td.mode='rc';
    }else{
      parseCSV(await f.text());
    }

    if(!td.races||td.races.length===0)throw new Error('No races found.');

    document.getElementById('ls').style.display='none';
    document.getElementById('ap').style.display='block';
    document.getElementById('bb').style.display='flex';
    initApp();
  }catch(e){
    logErr(e.message);
    document.getElementById('lsText').textContent='Failed';
    document.getElementById('ls').innerHTML+='<div style="margin-top:20px"><button onclick="location.reload()" style="padding:12px 24px;border-radius:10px;border:1px solid #ff5252;background:rgba(255,82,82,0.1);color:#ff5252;font-size:14px;cursor:pointer;font-weight:700">🔄 Try Again</button></div>';
  }
}

// ==================== PDF EXTRACTION ====================
async function extractPDFText(file){
  const ab=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:ab}).promise;
  log('Pages: '+pdf.numPages);
  let allLines=[];
  for(let i=1;i<=pdf.numPages;i++){
    const page=await pdf.getPage(i);
    const content=await page.getTextContent();
    const lines=reconstructLines(content.items);
    allLines=allLines.concat(lines);
    log('  P'+i+': '+lines.length+' lines');
  }
  return allLines.join('\n');
}

function reconstructLines(items){
  // Group by y-coordinate (within 4px), sort by x, join with EMPTY string
  // This matches PyPDF2's compact output where adjacent fields touch
  const groups={};
  const TH=4;
  for(const it of items){
    const y=Math.round(it.transform[5]);
    const x=it.transform[4];
    let gy=null;
    for(const k in groups){if(Math.abs(Number(k)-y)<=TH){gy=Number(k);break;}}
    if(gy===null)gy=y;
    if(!groups[gy])groups[gy]=[];
    groups[gy].push({x:x,str:it.str});
  }
  const sortedY=Object.keys(groups).map(Number).sort((a,b)=>b-a);
  const out=[];
  for(const y of sortedY){
    const lineItems=groups[y].sort((a,b)=>a.x-b.x);
    // Join with empty string - BRISNET PDFs have touching fields
    let line=lineItems.map(it=>it.str).join('');
    out.push(line);
  }
  return out;
}

// ==================== FORMAT DETECTION ====================
function detectFormat(text){
  const t=text.toUpperCase();
  if(t.includes('OFF AT')&&t.includes('MUTUEL'))return'results';
  if(t.includes('POST TIME')||t.includes('M/L'))return'entries';
  if(t.includes('WINNER')&&t.includes('EXACTA'))return'results';
  if(t.includes('LAST RACED')&&t.includes('#HORSE'))return'results';
  return'unknown';
}

// ==================== RESULTS PARSER ====================
function parseResultsText(text){
  const markers=['FIRST RACE','SECOND RACE','THIRD RACE','FOURTH RACE',
    'FIFTH RACE','SIXTH RACE','SEVENTH RACE','EIGHTH RACE',
    'NINTH RACE','TENTH RACE','ELEVENTH RACE','TWELFTH RACE'];
  const pos=[];
  for(const m of markers){const p=text.indexOf(m);if(p!==-1)pos.push({p,m,num:markers.indexOf(m)+1});}
  pos.sort((a,b)=>a.p-b.p);pos.push({p:text.length,m:'END',num:99});
  const races=[];
  for(let i=0;i<pos.length-1;i++){
    const r=parseResultsRace(pos[i].num,text.substring(pos[i].p,pos[i+1].p));
    if(r&&r.horses.length){races.push(r);log('  R'+r.num+': '+r.horses.length+' horses');}
  }
  return races;
}

function parseResultsRace(num,chunk){
  const lines=chunk.split('\n').map(l=>l.trim()).filter(l=>l);
  const r={number:num,name:'',distance:'',surface:'Dirt',purse:'',track:'',date:'',off_time:'',track_condition:'',win_time:'',fractional_times:'',horses:[]};

  if(lines[0]){
    const m1=lines[0].match(/^(\d+½?\s*(?:YARDS|FURLONGS|MILE\.?))/);
    if(m1)r.distance=m1[1];
    if(lines[0].includes('(Turf)'))r.surface='Turf';
    const m2=lines[0].match(/Purse\s+\$([\d,]+)/);
    if(m2)r.purse='$'+m2[1];
    const m3=lines[0].match(/\)\s*([A-Z][A-Z\s]+)\.?/);
    if(m3)r.name=m3[1].trim();
  }
  for(const l of lines){
    const m=l.match(/([A-Za-z]+\s+[A-Za-z]+)\s+(\w+\s+\d{1,2}[a-z]{0,2},\s*\d{4})/);
    if(m&&!l.includes('Value of Race')&&!l.includes('RACES SINCE')){r.track=m[1];r.date=m[2];break;}
  }
  for(const l of lines){
    if(l.startsWith('OFF AT')){
      const m1=l.match(/OFF AT\s+(\d+:\d+)/);if(m1)r.off_time=m1[1];
      const m2=l.match(/Track\s+(\w+)/);if(m2)r.track_condition=m2[1];
      const m3=l.match(/Time\s+([^\(]+)/);if(m3)r.win_time=m3[1].trim();
      const m4=l.match(/\(([^)]+)\)/);if(m4)r.fractional_times=m4[1];
      break;
    }
  }

  let hIdx=-1,hLine='';
  for(let i=0;i<lines.length;i++){
    if(lines[i].includes('Last Raced')&&lines[i].includes('#Horse')){hIdx=i;hLine=lines[i];break;}
  }
  if(hIdx===-1){log('  No header for R'+num);return r;}

  const fmt={hasTime:hLine.includes('Time')&&!hLine.includes("Cl'g Pr"),hasClg:hLine.includes("Cl'g Pr"),has14:hLine.includes('¼'),has12:hLine.includes('½'),has34:hLine.includes('¾')};

  for(let i=hIdx+1;i<lines.length;i++){
    const l=lines[i];
    if(!l||l.startsWith('OFF AT')||l.includes('Mutuel Prices')||l.includes('Owners-')||l.includes('Trainers-')||l.includes('Breeders-')||l.includes('Copyright'))break;
    if(/^\d{2}[A-Za-z]{3}\d{2}/.test(l)||/^\s*\d{1,2}[A-Za-z]/.test(l)){
      const h=parseHorseLine(l,fmt);
      if(h)r.horses.push(h);
    }
  }
  return r;
}

function parseHorseLine(line,fmt){
  line=line.trim();if(!line)return null;
  const o={};

  const dm=line.match(/^(\d{2}[A-Za-z]{3}\d{2}[^\s]{0,5})\s+/);
  if(dm){o.lastRaced=dm[1];line=line.substring(dm[0].length);}else{o.lastRaced='';}

  const nm=line.match(/^(\d{1,2})/);
  if(!nm)return null;
  o.number=parseInt(nm[1]);
  let rem=line.substring(nm[0].length);

  const om=rem.match(/(\d+\.\d{2})$/);
  if(!om)return null;
  o.odds=om[1];
  rem=rem.substring(0,om.index).trim();

  const asm=rem.match(/(\d[GCFHM])/);
  if(!asm)return null;
  o.ageSex=asm[1];

  const ne=rem.substring(0,asm.index);
  const epats=['L bf','L b','Lbf','Lb','bfk','bf','bk','hf','b','L','f','k'];
  let equip='';
  for(const p of epats){if(ne.endsWith(p)){equip=p;o.name=ne.substring(0,ne.length-p.length).trim();break;}}
  if(!o.name)o.name=ne.trim();
  o.equipment=equip;

  const wa=rem.substring(asm.index+asm[0].length);
  const wm=wa.match(/^(\d{2,3})/);
  if(!wm)return null;
  o.weight=parseInt(wm[1]);
  let afterW=wa.substring(wm[0].length);
  const ppm=afterW.match(/^(\d{1,2})/);
  if(!ppm)return null;
  o.pp=parseInt(ppm[1]);
  let afterPP=afterW.substring(ppm[0].length).trim();

  o.time='';o.clgPr='';o.jockey='';o.positions='';
  o.st='';o.q='';o.h='';o.tq='';o.str='';o.fn='';

  if(fmt.hasTime){
    const tm=afterPP.match(/(\d:\d{2}\.\d{2})/);
    if(tm){o.time=tm[1];o.jockey=afterPP.substring(0,tm.index).trim();o.positions=afterPP.substring(tm.index+tm[0].length).trim();}
    else{o.jockey=afterPP;}
  }else{
    const posPat=/[\d²³©¨ª«¬­®ƒ‚\x81\xad\xaf\xa7\xb2\xb3]+/;
    if(fmt.hasClg){
      const cm=afterPP.match(/\b(\d{3,5})\b/);
      if(cm){o.clgPr=cm[1];o.jockey=afterPP.substring(0,cm.index).trim();const ac=afterPP.substring(cm.index+cm[0].length).trim();const pm=ac.match(posPat);if(pm)o.positions=pm[0];}
      else{o.jockey=afterPP;}
    }else{
      const pm=afterPP.match(posPat);
      if(pm){o.jockey=afterPP.substring(0,pm.index).trim();o.positions=pm[0];}
      else{o.jockey=afterPP;}
    }
  }

  if(o.positions){
    const parts=o.positions.match(/\d+[^\d]*/g)||[];
    const cols=[];if(fmt.has14)cols.push('q');if(fmt.has12)cols.push('h');if(fmt.has34)cols.push('tq');
    const all=['st',...cols,'str','fn'];
    for(let i=0;i<all.length;i++)if(i<parts.length)o[all[i]]=parts[i].trim();
  }
  return o;
}

// ==================== ENTRIES PARSER ====================
function parseEntriesText(text){
  const markers=['FIRST RACE','SECOND RACE','THIRD RACE','FOURTH RACE',
    'FIFTH RACE','SIXTH RACE','SEVENTH RACE','EIGHTH RACE',
    'NINTH RACE','TENTH RACE','ELEVENTH RACE','TWELFTH RACE'];
  const pos=[];
  for(const m of markers){const p=text.indexOf(m);if(p!==-1)pos.push({p,m,num:markers.indexOf(m)+1});}
  pos.sort((a,b)=>a.p-b.p);pos.push({p:text.length,m:'END',num:99});
  const races=[];
  for(let i=0;i<pos.length-1;i++){
    const r=parseEntriesRace(pos[i].num,text.substring(pos[i].p,pos[i+1].p));
    if(r&&r.horses.length)races.push(r);
  }
  return races;
}

function parseEntriesRace(num,chunk){
  const lines=chunk.split('\n').map(l=>l.trim()).filter(l=>l);
  const r={number:num,name:'',distance:'',surface:'Dirt',purse:'',track:'',date:'',postTime:'',horses:[]};

  if(lines[0]){
    const m1=lines[0].match(/^(\d+½?\s*(?:YARDS|FURLONGS|MILE\.?))/);
    if(m1)r.distance=m1[1];
    if(lines[0].includes('(Turf)'))r.surface='Turf';
    const m2=lines[0].match(/Purse\s+\$([\d,]+)/);
    if(m2)r.purse='$'+m2[1];
  }
  for(const l of lines){
    const m=l.match(/([A-Za-z]+\s+[A-Za-z]+)\s+(\w+\s+\d{1,2}[a-z]{0,2},\s*\d{4})/);
    if(m&&!l.includes('Value of Race')){r.track=m[1];r.date=m[2];break;}
  }
  for(const l of lines){const m=l.match(/Post\s+Time\s+(\d+:\d+)/i);if(m){r.postTime=m[1];break;}}

  let hIdx=-1;
  for(let i=0;i<lines.length;i++){
    if((lines[i].includes('PP')&&lines[i].includes('Horse')&&lines[i].includes('Jockey'))||(lines[i].includes('M/L')&&lines[i].includes('Horse'))){hIdx=i;break;}
  }
  if(hIdx===-1)return r;

  for(let i=hIdx+1;i<lines.length;i++){
    const l=lines[i];
    if(!l||l.includes('Copyright')||l.includes('Trainers-')||l.includes('Owners-'))break;
    const m=l.match(/^(\d{1,2})\s+([A-Za-z][A-Za-z\s]+?)\s+(L\s+bf|L\s+b|Lbf|Lb|bfk|bf|bk|hf|b|L|f|k)?\s*(\d[GCFHM])\s+(\d{2,3})\s+([A-Za-z\s\.]+?)\s+(\d+\.?\d*)\s*$/);
    if(m){
      r.horses.push({pp:parseInt(m[1]),name:m[2].trim(),equipment:(m[3]||'').trim(),ageSex:m[4],weight:parseInt(m[5]),jockey:m[6].trim(),ml:m[7],number:parseInt(m[1])});
    }
  }
  return r;
}

// ==================== CSV PARSER ====================
function parseCSV(text){
  const lines=text.trim().split('\n');
  if(lines.length<2)return;
  const h=parseLine(lines[0]).map(x=>x.trim().toLowerCase().replace(/"/g,''));
  const get=n=>h.indexOf(n.toLowerCase());
  const ix={rn:get('race #'),na:get('race name'),di:get('distance'),su:get('surface'),pu:get('purse'),ho:get('horse'),ra:get('rank'),od:get('odds'),jo:get('jockey'),tr:get('trainer'),we:get('weight'),ds:get('dslr'),wo:get('workouts'),bl:get('blinkers'),la:get('lasix'),ju:get('jockey change'),be:get('beats'),lp:get('last pos'),lt:get('last track'),lf:get('last fig'),no:get('notes'),ti:get('post time')};
  const isRC=h.includes('positions raw')||h.includes('horse #');
  td.mode=isRC?'rc':'pp';

  if(isRC){
    const tr=get('track'),dt=get('date');
    const rs={};
    for(let i=1;i<lines.length;i++){
      const c=parseLine(lines[i]);if(c.length<5)continue;
      const n=parseInt(c[ix.rn])||0;if(!n)continue;
      if(!rs[n])rs[n]={num:n,name:c[ix.na]||`Race ${n}`,dist:c[ix.di]||'',surf:c[ix.su]||'Dirt',purse:c[ix.pu]||'',track:c[tr]||'',date:c[dt]||'',horses:[]};
      rs[n].horses.push({number:parseInt(c[get('horse #')]||0),name:c[get('horse')]||'',equipment:c[get('m/eqt')]||'',ageSex:c[get('a/s')]||'',weight:parseInt(c[get('wt')]||0),pp:parseInt(c[get('pp')]||0),jockey:c[get('jockey')]||'',clgPr:c[get('clg pr')]||'',time:c[get('time')]||'',lastRaced:c[get('last raced')]||'',odds:c[get('odds')]||'',st:c[get('st')]||'',q:c[get('1/4')]||'',h:c[get('1/2')]||'',tq:c[get('3/4')]||'',str:c[get('str')]||'',fn:c[get('fin')]||''});
    }
    td.races=Object.values(rs).sort((a,b)=>a.num-b.num);
    td.name=td.races[0]?.track||'Unknown';td.date=td.races[0]?.date||'';
  }else{
    const rs={};
    for(let i=1;i<lines.length;i++){
      const c=parseLine(lines[i]);if(c.length<5)continue;
      const n=parseInt(c[ix.rn])||0;if(!n)continue;
      if(!rs[n])rs[n]={num:n,name:c[ix.na]||`Race ${n}`,dist:c[ix.di]||'',surf:c[ix.su]||'Dirt',purse:c[ix.pu]||'',time:c[ix.ti]||'',play:'fair',horses:[]};
      const w=(c[ix.wo]||'').trim();const wo=w?w.split(/[\/\-]/):['a','a','a','a'];const rank=parseInt(c[ix.ra])||99;
      rs[n].horses.push({name:c[ix.ho]||'',rank:rank,odds:c[ix.od]||'',score:rank?100-(rank*8):50,jockey:c[ix.jo]||'',trainer:c[ix.tr]||'',weight:parseInt(c[ix.we])||120,dslr:parseInt(c[ix.ds])||14,workouts:wo,blinkersOn:(c[ix.bl]||'').toUpperCase()==='ON',lasix:(c[ix.la]||'').toLowerCase()==='yes',jockeyUp:(c[ix.ju]||'').toLowerCase()==='yes',beats:(c[ix.be]||'').split(';').filter(b=>b&&b!=='None'),lastPos:parseInt(c[ix.lp])||0,lastTrack:c[ix.lt]||'',lastFig:parseInt(c[ix.lf])||0,notes:c[ix.no]||''});
    }
    td.races=Object.values(rs).sort((a,b)=>a.num-b.num);
    td.races.forEach(r=>{r.horses.sort((a,b)=>a.rank-b.rank);const t=r.horses[0];if(t&&t.score>=85)r.play='best';else if(t&&t.score>=75)r.play='good';});
    td.name='Imported Card';td.date=new Date().toLocaleDateString();
  }
}

function parseLine(line){
  const r=[];let c='',q=false;
  for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"')q=!q;else if(ch===','&&!q){r.push(c.trim());c='';}else c+=ch;}
  r.push(c.trim());return r;
}

  else if(td.mode==='en'){ml.textContent='ENTRIES';ml.className='mode-badge en';}

function wd(a){return'<span style="display:flex;gap:3px">'+a.map(x=>'<span style="width:7px;height:7px;border-radius:50%;background:'+(x==='g'?'#00c853':x==='a'?'#ffab00':'#ff5252')+'"></span>').join('')+'</span>';}
function rcn(r){return r===1?'r1':r===2?'r2':r===3?'r3':'ro';}
function pcl(p){return p==='best'?'b':p==='good'?'g':'';}
function plb(p){return p==='best'?'BEST':p==='good'?'GOOD':'FAIR';}
function sc(s){return s>=90?'#00c853':s>=80?'#448aff':s>=70?'#ffab00':'#ff5252';}

function dt(h){
  let t=[];
  if(h.dslr<=14&&h.dslr>0)t.push('<span class="dt bf">'+h.dslr+'d</span>');
  else if(h.dslr>=42)t.push('<span class="dt al">'+h.dslr+'d off</span>');
  else if(h.dslr>0)t.push('<span class="dt">'+h.dslr+'d</span>');
  else t.push('<span class="dt" style="color:#ffab00">DEBUT</span>');
  if(h.blinkersOn)t.push('<span class="dt bf">BLINK</span>');
  if(!h.lasix)t.push('<span class="dt al">NO L</span>');
  if(h.jockeyUp)t.push('<span class="dt bf">J+</span>');
  if(h.beats.length>0)t.push('<span class="dt bf">Beats '+h.beats.length+'</span>');
  return t.join('');
}

function hr(h,sh){
  const d=sh?`<div style="margin:6px 0 2px 36px;padding:10px;border-radius:8px;background:#242424;font-size:12px"><div style="color:#888;margin-bottom:3px">${h.lastPos?h.lastPos+h.lastTrack+' Fig:'+h.lastFig:'DEBUT'}</div><div style="color:#666;font-size:11px">${h.notes}</div><div class="tg">${dt(h)}</div></div>`:'';
  return `<div class="hr"><div class="rn ${rcn(h.rank)}">${h.rank}</div><div class="hi"><div class="hn">${h.name}</div><div class="hd">${h.jockey} / ${h.trainer} ${wd(h.workouts)}</div><div style="height:4px;border-radius:2px;background:#2a2a2a;margin-top:3px;overflow:hidden"><div style="height:100%;border-radius:2px;width:${h.score}%;background:${sc(h.score)}"></div></div></div><div class="ob"><div class="ov">${h.odds}</div></div></div>${d}`;
}

function rca(r){
  const e=er.has('r-'+r.num);
  return `<div class="rc"><div class="rh"><div><div class="rt">Race ${r.num} — ${r.name}</div><div class="rm">${r.time} · ${r.dist} · ${r.surf} · ${r.purse}</div></div><span class="pb ${pcl(r.play)}">${plb(r.play)}</span></div>${r.horses.map(h=>hr(h,e)).join('')}<button class="eb" onclick="te(${r.num})">${e?'Collapse':'Expand'}</button></div>`;
}

function renderPPRaces(){
  let r=td.races;
  if(cf==='best')r=r.filter(x=>x.play==='best');
  else if(cf==='good')r=r.filter(x=>x.play==='good');

  else if(cf==='turf')r=r.filter(x=>x.surf.toLowerCase()==='turf');

function renderPPBest(){
  const b=td.races.filter(r=>r.play==='best').sort((a,b)=>b.horses[0].score-a.horses[0].score);

function renderPPWorks(){
  const a=[];td.races.forEach(r=>r.horses.forEach(h=>a.push({...h,rn:r.num})));

  document.getElementById('pt').innerHTML=h;
}

function st(t){
  document.querySelectorAll('.t').forEach(x=>x.classList.remove('a'));
  document.querySelectorAll('.p').forEach(x=>x.classList.remove('a'));
  const tabs=['r','b','c','t'],panes=['pr','pb','pc','pt'];
  const idx=tabs.indexOf(t);
  if(idx>=0){document.querySelectorAll('.t')[idx].classList.add('a');document.getElementById(panes[idx]).classList.add('a');}
  if(td.mode==='pp')document.getElementById('fr').style.display=(t==='r')?'flex':'none';
}

function fr(t){cf=t;document.querySelectorAll('.fc').forEach(c=>c.classList.remove('a'));event.target.classList.add('a');if(td.mode==='pp')renderPPRaces();}
function te(n){const k='r-'+n;if(er.has(k))er.delete(k);else er.add(k);if(td.mode==='pp'){renderPPRaces();renderPPBest();}}

    download(csv,'brisnet_pp.csv','text/csv');
